
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#12110f">
  <meta name="description" content="Jishnu Ganguly — EST. 2011. Independent music, aviation, technology and creative projects.">
  <title>Jishnu Ganguly — EST. 2011</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #12110f;
      --bg2: #1b1916;
      --surface: #211e1a;
      --surface2: #29241f;
      --text: #eee9df;
      --muted: #a49a8d;
      --faint: #70685f;
      --line: rgba(238,233,223,.14);
      --accent: #ff784c;
      --accent2: #d85b35;
      --accent-glow: rgba(255,120,76,.16);
      --nav: rgba(18,17,15,.76);
      --serif: "Playfair Display", Georgia, serif;
      --sans: "DM Sans", Arial, sans-serif;
      --mono: "DM Mono", monospace;
    }

    [data-theme="light"] {
      --bg: #eee9df;
      --bg2: #e6ded2;
      --surface: #e1d9ce;
      --surface2: #d8cec1;
      --text: #211d19;
      --muted: #71675d;
      --faint: #918579;
      --line: rgba(33,29,25,.16);
      --accent: #d95730;
      --accent2: #ad3f20;
      --accent-glow: rgba(217,87,48,.12);
      --nav: rgba(238,233,223,.82);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 90px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      overflow-x: hidden;
      transition: background .4s, color .4s;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button, input, select {
      font: inherit;
    }

    button {
      color: inherit;
    }

    ::selection {
      background: var(--accent);
      color: #1b100b;
    }

    /* ATMOSPHERE */

    .ambient {
      position: fixed;
      inset: 0;
      z-index: -5;
      pointer-events: none;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 12% 9%, rgba(255,120,76,.13), transparent 38%),
        radial-gradient(ellipse at 85% 32%, rgba(163,104,73,.09), transparent 34%),
        radial-gradient(ellipse at 52% 90%, rgba(255,171,106,.055), transparent 42%),
        var(--bg);
    }

    .ambient::before,
    .ambient::after {
      content: "";
      position: absolute;
      width: 55vw;
      height: 55vw;
      min-width: 340px;
      min-height: 340px;
      border-radius: 50%;
      filter: blur(100px);
      background: var(--accent);
      opacity: .075;
      animation: atmosphere 25s ease-in-out infinite alternate;
    }

    .ambient::before {
      top: -28%;
      left: -25%;
    }

    .ambient::after {
      bottom: -35%;
      right: -25%;
      opacity: .055;
      animation-delay: -10s;
    }

    @keyframes atmosphere {
      from { transform: translate(0,0) scale(1); }
      to { transform: translate(10vw,12vh) scale(1.25); }
    }

    .grain {
      position: fixed;
      inset: 0;
      z-index: -3;
      pointer-events: none;
      opacity: .045;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.6'/%3E%3C/svg%3E");
    }

    .grid-bg {
      position: fixed;
      inset: 0;
      z-index: -4;
      pointer-events: none;
      opacity: .105;
      background-image:
        linear-gradient(var(--line) 1px, transparent 1px),
        linear-gradient(90deg, var(--line) 1px, transparent 1px);
      background-size: 100px 100px;
      mask-image: linear-gradient(to bottom, black, transparent 85%);
    }

    /* GLOBAL ELEMENTS */

    .progress {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 2000;
      height: 2px;
      width: 0;
      background: var(--accent);
    }

    .cursor,
    .cursor-ring {
      position: fixed;
      z-index: 3000;
      top: 0;
      left: 0;
      pointer-events: none;
      border-radius: 50%;
      transform: translate(-50%,-50%);
    }

    .cursor {
      width: 6px;
      height: 6px;
      background: var(--accent);
    }

    .cursor-ring {
      width: 34px;
      height: 34px;
      border: 1px solid var(--accent);
      opacity: .55;
      transition: width .2s, height .2s, opacity .2s;
    }

    body.hovering .cursor-ring {
      width: 55px;
      height: 55px;
      opacity: .9;
    }

    .container {
      width: min(1160px, 88%);
      margin: 0 auto;
    }

    .eyebrow {
      color: var(--accent);
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    .section {
      position: relative;
      padding: 135px 0;
      border-top: 1px solid var(--line);
    }

    .section-heading {
      margin-top: 17px;
      font-family: var(--serif);
      font-size: clamp(43px, 6vw, 78px);
      font-weight: 500;
      line-height: 1.03;
      letter-spacing: -.05em;
    }

    .section-heading em {
      color: var(--accent);
      font-weight: 500;
    }

    .section-intro {
      max-width: 560px;
      margin-top: 22px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.95;
    }

    .rule {
      height: 1px;
      background: var(--line);
      width: 100%;
    }

    .button {
      min-height: 46px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 0 19px;
      background: var(--accent);
      color: #21140f;
      border: 1px solid var(--accent);
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: .1em;
      text-transform: uppercase;
      cursor: pointer;
      transition: .25s ease;
    }

    .button:hover {
      color: var(--accent);
      background: transparent;
    }

    .button.outline {
      background: transparent;
      color: var(--text);
      border-color: var(--line);
    }

    .button.outline:hover {
      color: var(--accent);
      border-color: var(--accent);
    }

    .text-link {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding-bottom: 7px;
      color: var(--accent);
      border-bottom: 1px solid var(--accent);
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: .1em;
      text-transform: uppercase;
      transition: gap .2s;
    }

    .text-link:hover {
      gap: 17px;
    }

    /* NAVIGATION */

    .topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1500;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 23px 6vw;
      border-bottom: 1px solid transparent;
      transition: .3s;
    }

    .topbar.scrolled {
      padding-top: 15px;
      padding-bottom: 15px;
      background: var(--nav);
      backdrop-filter: blur(20px);
      border-color: var(--line);
    }

    .brand {
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .brand span {
      color: var(--accent);
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 30px;
    }

    .nav-right a,
    .theme-button,
    .menu-button {
      color: var(--muted);
      background: none;
      border: 0;
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: .12em;
      text-transform: uppercase;
      cursor: pointer;
      transition: color .2s;
    }

    .nav-right a:hover,
    .theme-button:hover {
      color: var(--accent);
    }

    .menu-button {
      display: none;
    }

    /* HERO */

    .hero {
      min-height: 100svh;
      display: flex;
      align-items: center;
      position: relative;
      overflow: hidden;
      padding: 150px 0 100px;
    }

    .hero-inner {
      position: relative;
      z-index: 2;
    }

    .hero-kicker {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 35px;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .hero-kicker::before {
      content: "";
      width: 36px;
      height: 1px;
      background: var(--accent);
    }

    .hero h1 {
      font-family: var(--serif);
      font-size: clamp(70px, 12vw, 158px);
      font-weight: 500;
      line-height: .87;
      letter-spacing: -.075em;
    }

    .hero h1 span {
      display: block;
      padding-left: clamp(20px, 10vw, 140px);
      color: var(--accent);
      font-style: italic;
    }

    .hero-lower {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 35px;
      margin-top: 65px;
    }

    .hero-copy {
      max-width: 390px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.95;
    }

    .hero-coordinates {
      text-align: right;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: .14em;
      line-height: 2.1;
    }

    .hero-coordinates strong {
      display: block;
      color: var(--text);
      font-size: 13px;
      font-weight: 400;
    }

    .hero-orbit {
      position: absolute;
      right: -12%;
      top: 15%;
      width: min(48vw, 620px);
      aspect-ratio: 1;
      border: 1px solid var(--line);
      border-radius: 50%;
      animation: rotate 65s linear infinite;
      opacity: .75;
    }

    .hero-orbit::before,
    .hero-orbit::after {
      content: "";
      position: absolute;
      inset: 13%;
      border: 1px solid var(--line);
      border-radius: 50%;
    }

    .hero-orbit::after {
      inset: 28%;
      border-color: rgba(255,120,76,.24);
    }

    .orbit-point {
      position: absolute;
      left: 18%;
      top: 17%;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 25px var(--accent);
    }

    @keyframes rotate {
      to { transform: rotate(360deg); }
    }

    .hero-index {
      position: absolute;
      right: 6vw;
      bottom: 40px;
      color: var(--faint);
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: .14em;
    }

    /* INTRO STATEMENT */

    .statement {
      padding: 100px 0 130px;
    }

    .statement-text {
      max-width: 1000px;
      font-family: var(--serif);
      font-size: clamp(33px, 5.5vw, 69px);
      line-height: 1.22;
      letter-spacing: -.04em;
    }

    .statement-text span {
      color: var(--muted);
    }

    .statement-text em {
      color: var(--accent);
    }

    /* MUSIC */

    .music-feature {
      display: grid;
      grid-template-columns: minmax(0, .95fr) minmax(0, 1.05fr);
      gap: clamp(45px, 8vw, 110px);
      align-items: center;
      margin-top: 70px;
    }

    .record-stage {
      min-width: 0;
      aspect-ratio: 1 / 1;
      display: grid;
      place-items: center;
      position: relative;
      overflow: hidden;
      border: 1px solid var(--line);
      background:
        radial-gradient(circle at 50% 50%, rgba(255,120,76,.16), transparent 55%),
        linear-gradient(145deg, var(--surface), var(--bg2));
    }

    .record-stage::before,
    .record-stage::after {
      content: "";
      position: absolute;
      width: 78%;
      aspect-ratio: 1;
      border: 1px solid var(--line);
      border-radius: 50%;
    }

    .record-stage::after {
      width: 92%;
      opacity: .5;
    }

    .record {
      width: min(75%, 355px);
      aspect-ratio: 1;
      position: relative;
      z-index: 2;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background:
        repeating-radial-gradient(
          circle,
          #171614 0px,
          #171614 2px,
          #292622 3px,
          #11100e 4px,
          #24211e 5px
        );
      box-shadow: 0 28px 80px rgba(0,0,0,.42);
    }

    .record.playing {
      animation: vinylSpin 3.4s linear infinite;
    }

    @keyframes vinylSpin {
      to { transform: rotate(360deg); }
    }

    .record::before {
      content: "";
      position: absolute;
      inset: 8%;
      border: 1px solid rgba(255,255,255,.10);
      border-radius: 50%;
    }

    .record::after {
      content: "";
      position: absolute;
      inset: 19%;
      border: 1px solid rgba(255,255,255,.07);
      border-radius: 50%;
    }

    /* The label is deliberately only a monogram.
       No album title is placed inside the spinning record. */

    .record-label {
      width: 35%;
      aspect-ratio: 1;
      border-radius: 50%;
      background:
        radial-gradient(circle at 35% 30%, #ffae83, transparent 60%),
        #df633b;
      color: #28150f;
      display: grid;
      place-items: center;
      position: relative;
      z-index: 3;
      border: 1px solid rgba(255,255,255,.2);
    }

    .record-label span {
      font-family: var(--serif);
      font-size: clamp(19px, 3.2vw, 35px);
      font-weight: 600;
      letter-spacing: -.08em;
    }

    .record-hole {
      position: absolute;
      z-index: 4;
      width: 7px;
      height: 7px;
      left: 50%;
      top: 50%;
      transform: translate(-50%,-50%);
      border-radius: 50%;
      background: #181411;
      box-shadow: 0 0 0 2px rgba(255,255,255,.18);
    }

    .record-stamp {
      position: absolute;
      left: 22px;
      bottom: 20px;
      z-index: 5;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: .12em;
    }

    .record-side {
      position: absolute;
      right: 22px;
      top: 22px;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: .12em;
    }

    .release-copy {
      min-width: 0;
    }

    .release-copy h3 {
      margin: 20px 0;
      font-family: var(--serif);
      font-size: clamp(39px, 5.5vw, 68px);
      font-weight: 500;
      line-height: 1.04;
      letter-spacing: -.05em;
    }

    .release-copy h3 em {
      color: var(--accent);
    }

    .release-description {
      max-width: 470px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.95;
    }

    .release-details {
      display: flex;
      flex-wrap: wrap;
      gap: 14px 25px;
      margin: 28px 0;
      padding: 18px 0;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .release-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .release-note {
      color: var(--faint);
      font-size: 11px;
      line-height: 1.8;
      margin-top: 20px;
    }

    .listen-area {
      margin-top: 75px;
    }

    .listen-heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 16px;
    }

    .listen-heading span {
      color: var(--muted);
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .soundcloud-frame {
      width: 100%;
      height: 166px;
      display: block;
      border: 0;
      border-radius: 3px;
      filter: saturate(.8);
    }

    /* PROJECTS */

    .project-list {
      margin-top: 65px;
      border-top: 1px solid var(--line);
    }

    .project {
      display: grid;
      grid-template-columns: 75px 1fr 35px;
      gap: 25px;
      align-items: center;
      padding: 29px 0;
      border-bottom: 1px solid var(--line);
      transition: padding .25s;
    }

    .project:hover {
      padding-left: 12px;
    }

    .project-index {
      color: var(--accent);
      font-family: var(--mono);
      font-size: 10px;
    }

    .project h3 {
      font-family: var(--serif);
      font-size: clamp(28px, 4vw, 45px);
      font-weight: 500;
      letter-spacing: -.04em;
    }

    .project p {
      margin-top: 7px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.7;
    }

    .project-arrow {
      color: var(--accent);
      font-size: 22px;
    }

    /* AVIATION */

    .aviation-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 25px;
    }

    .aviation-stamp {
      color: var(--accent);
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: .15em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .aviation-layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 22px;
      margin-top: 60px;
    }

    .aviation-panel {
      min-width: 0;
      border: 1px solid var(--line);
      background: var(--panel);
      padding: 27px;
    }

    .panel-label {
      color: var(--accent);
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .panel-title {
      margin-top: 15px;
      font-family: var(--serif);
      font-size: 32px;
      font-weight: 500;
      letter-spacing: -.03em;
    }

    .panel-description {
      margin-top: 12px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.8;
    }

    .flight-form {
      margin-top: 30px;
    }

    .flight-form label,
    .route-form label {
      display: block;
      margin-bottom: 11px;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .flight-entry {
      display: flex;
      min-width: 0;
      border-bottom: 1px solid var(--accent);
    }

    .flight-entry input {
      flex: 1;
      min-width: 0;
      padding: 14px 0;
      color: var(--text);
      background: transparent;
      border: 0;
      outline: none;
      font-family: var(--mono);
      font-size: 14px;
      text-transform: uppercase;
    }

    .flight-entry input::placeholder {
      color: var(--faint);
    }

    .flight-entry button {
      padding-left: 12px;
      border: 0;
      background: none;
      color: var(--accent);
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: .1em;
      cursor: pointer;
      white-space: nowrap;
    }

    .airport-shortcuts {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 23px;
    }

    .airport-shortcuts a {
      padding: 10px 12px;
      border: 1px solid var(--line);
      color: var(--muted);
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: .08em;
      transition: .2s;
    }

    .airport-shortcuts a:hover {
      color: var(--accent);
      border-color: var(--accent);
    }

    .route-form {
      margin-top: 30px;
    }

    .route-selects {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .select-wrap select {
      width: 100%;
      min-width: 0;
      padding: 13px 10px;
      color: var(--text);
      background: var(--bg2);
      border: 1px solid var(--line);
      outline: none;
      font-family: var(--mono);
      font-size: 11px;
    }

    .select-wrap select:focus {
      border-color: var(--accent);
    }

    .route-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 18px;
    }

    .route-actions .button {
      min-height: 41px;
      padding: 0 13px;
      font-size: 9px;
    }

    .route-result {
      display: none;
      margin-top: 23px;
      paddin
